[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmk"
version = "1.0.0"
description = "Replication package of 'Conditional Moment Kernels: Joint Modeling of Expected Returns and Covariances in Unbalanced Panels'"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Damir Filipovic" }, { name = "Paul Schneider" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# data preparation: the JKP parquet file and the WRDS PostgreSQL server
data = ["pyarrow>=15", "psycopg[binary]>=3.1"]
# the solver cross-checks of the test suite
test = ["pytest>=8", "cvxpy>=1.5", "clarabel>=0.7"]

[project.scripts]
cmk = "cmk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
